<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estancioncita Aurea</title>
<meta name="description" content="Estación Ambient Weather WS-2902 en Duitama, Boyacá: pronóstico de lluvia a 3 h y de potencia fotovoltaica a 1 h, verificado y reajustado automáticamente con cada medición.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFF7E4; --paper:#FFFDF5;
    --ink:#211D14; --ink-dim:#6B6354; --border:#ECE2C4;
    --brand:#C9920B; --brand-soft:#FDF3D9; --brand-ink:#7A5400;
    --rain:#96650B; --rain-soft:#FBEFD3;
    --frost:#6B5A12; --frost-soft:#F3EED2;
    --sun:#A84610; --sun-soft:#FBE4D2;
    --danger:#A6311F; --danger-soft:#FBE7E2;
    --ok:#1F7A46; --ok-soft:#E5F4EB;
    --shadow: 0 1px 2px rgba(33,29,20,.06), 0 20px 40px -24px rgba(33,29,20,.20);
    --font-display:'Spectral', Georgia, serif;
    --font-body:'Work Sans', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  }
  *{ box-sizing:border-box; }
  html{ background:var(--bg); }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); }
  h1,h2,h3,h4{ font-family:var(--font-display); text-wrap:balance; margin:0; }
  .tabular{ font-variant-numeric:tabular-nums; }
  .mono{ font-family:var(--font-mono); }
  button{ font-family:inherit; }
  button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  ::selection{ background:var(--brand-soft); }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }

  /* ---------- Shell ---------- */
  .app-header{ position:sticky; top:0; z-index:10; background:rgba(255,255,255,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); }
  .app-header::before{ content:""; display:block; height:3px; background:var(--brand); }
  .header-inner{ max-width:1120px; margin:0 auto; padding:12px 20px; display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:36px; height:36px; border-radius:10px; background:var(--brand-soft); color:var(--brand-ink); display:flex; align-items:center; justify-content:center; flex:none; }
  .brand-mark svg{ width:20px; height:20px; }
  .brand h1{ font-size:18px; font-weight:700; letter-spacing:-0.01em; }
  .brand .loc{ font-size:11.5px; color:var(--ink-dim); margin:1px 0 0; display:flex; align-items:center; gap:4px; }
  .daynight{ width:13px; height:13px; flex:none; }
  .header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .segmented{ display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; }
  .segmented button{ border:none; background:none; font-size:12.8px; font-weight:600; padding:7px 15px; border-radius:999px; cursor:pointer; color:var(--ink-dim); white-space:nowrap; transition:background .15s ease, color .15s ease; }
  .segmented button.active{ background:var(--brand); color:var(--ink); }
  .segmented button:not(.active):hover{ color:var(--ink); }

  .status-pill{ display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:500; white-space:nowrap; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); }
  .status-pill .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .dot.on{ background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
  .dot.off{ background:var(--danger); box-shadow:0 0 0 3px var(--danger-soft); }

  .btn-refresh{ border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn-refresh svg{ width:14px; height:14px; }
  .btn-refresh:hover{ border-color:var(--brand); color:var(--brand-ink); }
  .btn-refresh:disabled{ opacity:.55; cursor:default; }
  .btn-refresh.spin svg{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .shell{ max-width:1120px; margin:0 auto; padding:20px 20px 52px; display:flex; flex-direction:column; gap:16px; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 22px; box-shadow:var(--shadow); }
  .panel-title{ font-size:17px; font-weight:600; margin:0 0 4px; }
  .panel-sub{ font-size:13px; color:var(--ink-dim); margin:0 0 14px; line-height:1.55; max-width:80ch; }

  /* ---------- Sensor strip ---------- */
  .sensor-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .sensor-tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); min-width:0; }
  .sensor-tile .label{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; }
  .sensor-tile .value{ font-family:var(--font-mono); font-size:21px; font-weight:600; line-height:1; }
  .sensor-tile .value small{ font-size:12px; color:var(--ink-dim); font-weight:400; margin-left:2px; }
  .sensor-tile .spark{ width:100%; height:28px; }
  @media(max-width:900px){ .sensor-grid{ grid-template-columns:repeat(3,1fr); } }
  @media(max-width:560px){ .sensor-grid{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- Verdict cards ---------- */
  .verdict-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media(max-width:900px){ .verdict-grid{ grid-template-columns:1fr; } }
  .vcard{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--tone,var(--border)); border-radius:14px; padding:18px 18px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:9px; min-width:0; }
  .vcard--rain{ --tone:var(--rain); }
  .vcard--frost{ --tone:var(--frost); }
  .vcard--sun{ --tone:var(--sun); }
  .vcard-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .vcard-icon{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .vcard-icon svg{ width:21px; height:21px; }
  .vcard--rain .vcard-icon{ background:var(--rain-soft); color:var(--rain); }
  .vcard--frost .vcard-icon{ background:var(--frost-soft); color:var(--frost); }
  .vcard--sun .vcard-icon{ background:var(--sun-soft); color:var(--sun); }
  .badge{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; letter-spacing:.02em; white-space:nowrap; }
  .badge--ok{ background:var(--ok-soft); color:var(--ok); }
  .badge--warn{ background:var(--sun-soft); color:var(--sun); }
  .badge--danger{ background:var(--danger-soft); color:var(--danger); }
  .badge--info{ background:var(--rain-soft); color:var(--rain); }
  .vcard-q{ font-size:12.5px; color:var(--ink-dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .vcard-a{ font-family:var(--font-display); font-size:21px; font-weight:600; line-height:1.15; }
  .meter{ height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .meter > i{ display:block; height:100%; border-radius:99px; }
  .vcard-window{ font-size:13px; line-height:1.5; color:var(--ink); }
  .muted-note{ color:var(--ink-dim); font-size:11px; }
  .vcard-reco{ font-size:12.8px; line-height:1.5; border-top:1px dashed var(--border); padding-top:9px; }
  .vcard-reco strong{ color:var(--ink); }
  .vcard-toggle{ align-self:flex-start; background:none; border:none; padding:0; font-size:12.3px; font-weight:600; color:var(--brand-ink); cursor:pointer; }
  .vcard-toggle:hover{ text-decoration:underline; }
  .vcard-detail{ background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:12.3px; color:var(--ink-dim); line-height:1.5; animation:fadeIn .18s ease; }
  .vcard-detail .big{ font-family:var(--font-mono); font-size:19px; color:var(--ink); font-weight:600; }
  .vcard-detail .formula{ display:block; margin-top:8px; font-family:var(--font-mono); font-size:11px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 8px; }

  /* ---------- Callout ---------- */
  .callout{ display:flex; gap:14px; align-items:flex-start; background:var(--brand-soft); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .callout svg{ width:23px; height:23px; color:var(--brand-ink); flex:none; margin-top:2px; }
  .callout h4{ font-size:14px; margin:0 0 4px; color:var(--brand-ink); }
  .callout p{ margin:0; font-size:12.8px; line-height:1.55; color:var(--ink); }

  /* ---------- Modelo tab ---------- */
  .charts-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:4px; }
  @media(max-width:900px){ .charts-grid{ grid-template-columns:1fr; } }
  .chart-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .chart-card h4{ font-family:var(--font-body); font-size:13px; font-weight:600; margin:0 0 8px; }
  /* Chart.js necesita que el CONTENEDOR del canvas tenga altura fija en CSS
     (no heredada del contenido) — si no, canvas y contenedor se miden el uno
     al otro en un ciclo y la página crece sola en cada actualización. */
  .chart-wrap{ position:relative; width:100%; height:230px; }
  canvas{ max-width:100%; }

  .metrics-head{ display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .metrics-note{ font-size:12.3px; color:var(--ink-dim); margin:0 0 10px; }
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim); font-weight:600; }
  td.mono{ font-family:var(--font-mono); }
  tr.best td{ color:var(--ok); font-weight:600; }

  /* ---------- Footer ---------- */
  .app-footer{ border-top:1px solid var(--border); background:var(--surface-2); }
  .footer-inner{ max-width:1120px; margin:0 auto; padding:16px 20px 22px; font-size:12px; color:var(--ink-dim); line-height:1.6; }
  .footer-inner strong{ color:var(--ink); }
  .footer-inner summary{ cursor:pointer; color:var(--brand-ink); font-weight:600; margin-top:6px; }
  .footer-inner details[open] summary{ margin-bottom:6px; }
