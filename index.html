  ::selection{ background:var(--brand-soft); }

  .brand-mark svg{ width:20px; height:20px; }

  .daynight{ width:13px; height:13px; flex:none; }
  .header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .segmented{ display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; }
  .segmented button{ border:none; background:none; font-size:12.8px; font-weight:600; padding:7px 15px; border-radius:999px; cursor:pointer; color:var(--ink-dim); white-space:nowrap; transition:background .15s ease, color .15s ease; }

  .status-pill{ display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:500; white-space:nowrap; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); }
  .status-pill .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .dot.on{ background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
  .dot.off{ background:var(--danger); box-shadow:0 0 0 3px var(--danger-soft); }

  .btn-refresh{ border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .btn-refresh svg{ width:14px; height:14px; }
  .btn-refresh:hover{ border-color:var(--brand); color:var(--brand-ink); }
  .btn-refresh:disabled{ opacity:.55; cursor:default; }
  .btn-refresh.spin svg{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .shell{ max-width:1120px; margin:0 auto; padding:20px 20px 52px; display:flex; flex-direction:column; gap:16px; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 22px; box-shadow:var(--shadow); }
  .panel-title{ font-size:17px; font-weight:600; margin:0 0 4px; }
  .panel-sub{ font-size:13px; color:var(--ink-dim); margin:0 0 14px; line-height:1.55; max-width:80ch; }

  .sensor-tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); min-width:0; }

  .sensor-tile .value{ font-family:var(--font-mono); font-size:21px; font-weight:600; line-height:1; }

  @media(max-width:560px){ .sensor-grid{ grid-template-columns:repeat(2,1fr); } }

  .vcard{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--tone,var(--border)); border-radius:14px; padding:18px 18px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:9px; min-width:0; }

  .vcard--sun .vcard-icon{ background:var(--sun-soft); color:var(--sun); }
  .badge{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; letter-spacing:.02em; white-space:nowrap; }

  /* Chart.js necesita que el CONTENEDOR del canvas tenga altura fija en CSS

  const h = Math.floor(min/60);
  if(h < 24) return `hace ${h} h`;
  return `hace ${Math.floor(h/24)} d`;
}
function calcularAnalisis(historial){
  if(!historial || historial.length===0) return null;
  const ultimo = historial[historial.length-1];
  const idx = Math.max(0, historial.length-4);
  const anterior = historial[idx];
  const deltaP = ultimo.presion_hpa - anterior.presion_hpa;
  const probLluvia = clamp((ultimo.humedad_pct-40)/60*60 + Math.max(0,-deltaP)*8, 0, 100);
  const hora = new Date(ultimo.fecha).getHours();
  const esNoche = (hora>=21 || hora<=7);
  let riesgoHelada = 'bajo';
  if(ultimo.temp_c < 0) riesgoHelada = 'alto';
  else if(esNoche && ultimo.temp_c < 5) riesgoHelada = 'medio';
  const tCelda = ultimo.temp_c + (45-20)/800*ultimo.radiacion_wm2;
  const pvKw = Math.max(0, 1.0*(ultimo.radiacion_wm2/1000)*(1+(-0.004)*(tCelda-25)));
  return {ultimo, probLluvia, riesgoHelada, pvKw, hora};
}
function pvDe(h){
  const tCelda = h.temp_c + (45-20)/800*h.radiacion_wm2;
  return Math.max(0, 1.0*(h.radiacion_wm2/1000)*(1+(-0.004)*(tCelda-25)));
}
function textoVentanaLluvia(hora, prob){
  if(hora < 12){
    return prob>=25
      ? 'Si llueve hoy, lo más probable es que sea en la tarde, entre la <strong>1:00 p.m. y las 6:00 p.m.</strong> (patrón típico de lluvia de convección en el altiplano).'
      : 'Por ahora no hay señales fuertes de lluvia; si cambia, la franja más probable seguiría siendo la tarde (1:00 p.m.–6:00 p.m.).';
  }
  if(hora >= 12 && hora < 18){
    return 'Estás dentro de la franja en que suele llover en el altiplano (<strong>hasta las 6:00 p.m.</strong> aprox.). Si no ha llovido todavía, aún podría hacerlo en las próximas horas.';
  }
  return 'Ya pasó la franja típica de lluvia de la tarde; para lo que resta del día es <strong>menos probable</strong> que llueva. La próxima ventana esperable sería mañana en la tarde.';
}
function textoVentanaHelada(hora, riesgo){
  if(hora>=18 || hora<3){
    return riesgo==='bajo'
      ? 'Con la lectura actual el riesgo es bajo, pero la ventana de mayor enfriamiento de la noche llega entre las <strong>3:00 a.m. y las 6:00 a.m.</strong>'
      : 'La ventana de <strong>mayor riesgo</strong> será esta madrugada, entre las 3:00 a.m. y las 6:00 a.m., cuando el enfriamiento nocturno es más fuerte.';
  }
  if(hora>=3 && hora<7){
    return 'Estás dentro de la franja de <strong>mayor riesgo de helada</strong> (3:00 a.m.–6:00 a.m.).';
  }
  return 'De día el riesgo de helada es mínimo; la próxima evaluación importante es para la madrugada siguiente (3:00 a.m.–6:00 a.m.).';
}
function textoFv(pvKw, hora){
  const pct = clamp(pvKw/1.0*100, 0, 999);
  if(pvKw <= 0.02){
    return (hora>=18 || hora<6)
      ? 'Es de noche: no hay generación solar en este momento.'
      : 'Prácticamente sin generación ahora mismo (probablemente muy nublado).';
  }
  return `Ahora mismo el sol alcanza para generar cerca del <strong>${pct.toFixed(0)}%</strong> de la capacidad de un sistema solar de 1 kWp (tamaño típico de vivienda rural). El ciclo diario típico de la zona alcanza su máximo hacia el mediodía.`;
}
function recoRiego(probLluvia, riesgoHelada){
  return probLluvia>=55
    ? 'Es probable que llueva en la tarde: puedes esperar antes de regar y ahorrar agua.'
    : (riesgoHelada!=='bajo'
        ? 'Si vas a regar, hazlo temprano en la mañana; el riego por aspersión durante la helada misma (no antes) es la técnica que protege por calor de congelación.'
        : 'Sin señales fuertes de lluvia ni de helada: riega según el plan normal del cultivo.');
}
function recoCultivo(probLluvia, riesgoHelada){
  return riesgoHelada!=='bajo'
    ? 'Cubre plántulas y cultivos sensibles (hortalizas, papa recién sembrada) con plástico o agrotela antes del atardecer.'
    : (probLluvia>=55
        ? 'Si hay cultivos recién fumigados o abonados, considera que la lluvia de la tarde puede lavar el producto.'
        : 'No se esperan condiciones extremas con la lectura actual; monitoreo normal.');
}
function recoEnergia(pctFv){
  return pctFv>40
    ? 'Buen momento para tareas que consuman energía (bombeo de agua, carga de baterías) si tienes paneles solares.'
    : 'Poca generación solar en este momento; si dependes de paneles, prioriza el consumo entre las 10 a.m. y las 2 p.m., cuando el ciclo típico de la zona alcanza su máximo.';
}

/* =========================================================================
   Sparkline propia en SVG (sin Chart.js) para las 5 tarjetas de sensores.
   ========================================================================= */
function Sparkline({data, color}){
  if(!data || data.length < 2) return e('div',{className:'spark'});
  const w = 100, h = 28;
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const step = w/(data.length-1);
  const pts = data.map((v,i)=> `${(i*step).toFixed(2)},${(h-((v-min)/range)*h).toFixed(2)}`).join(' ');
  return e('svg',{className:'spark',viewBox:`0 0 ${w} ${h}`,preserveAspectRatio:'none'},
    e('polyline',{points:pts, fill:'none', stroke:color, strokeWidth:1.8, strokeLinecap:'round', strokeLinejoin:'round'}));
}

      e('div',null, e('strong',null,'Proyecto GRIDSE / AUREA'), ' — UPTC Seccional Duitama. Sistema inteligente de predicción meteorológica y generación fotovoltaica con estación Ambient Weather WS-2902.'),
      e('details',null,
        e('summary',null,'Real vs. ilustrativo, y alcance de las recomendaciones'),
        e('p',{style:{margin:'0 0 6px'}}, 'La pestaña "Hoy" consulta la API de AmbientWeather directamente desde este navegador (sin servidor intermedio); si la estación está desconectada seguirá mostrando su última lectura real, con la fecha siempre visible. La pestaña "Datos y modelo" es siempre simulada, para fines de demostración metodológica.'),
        e('p',{style:{margin:0}}, 'Las "respuestas" y "recomendaciones" son reglas simples de apoyo a la decisión, no un pronóstico oficial ni asesoría técnica personalizada.')
      )
    )
  );
}

/* =========================================================================
   Conexión con la API de AmbientWeather.
   Sitio estático (sin backend): el propio navegador llama DIRECTO a la API
   (no hay servidor intermedio ni tarea programada). Por eso funciona igual
   de "en vivo" en cualquier hosting estático.
   OJO seguridad: al no haber backend, estas llaves quedan visibles en el
   código fuente. Son de solo-lectura de ESTA estación (no controlan nada
   ni exponen otras cuentas), así que el riesgo real es bajo.
   ========================================================================= */
const AMBIENT_API_KEY = 'c271fa0189914f749bd5fa441ca604f03e2a8316b3374b24992f16b36cbe5328';
const AMBIENT_APP_KEY = '36258202a32147c4a872c5ee756b9707f9066bebc2574e1c8a38a015211cdc84';
const AMBIENT_MAC = '8C:4F:00:4F:8B:95';
const INTERVALO_MS = 5 * 60 * 1000; // la estación reporta cada 5 min como máximo

function convertirRegistroApi(r){
  const fechaUtc = new Date(r.date);
  const fechaLocal = new Date(fechaUtc.getTime() - 5*3600*1000); // Bogotá = UTC-5 fijo
  return {
    fecha: fechaLocal.toISOString().slice(0,19),
    temp_c: Math.round(((r.tempf-32)*5/9)*100)/100,
    humedad_pct: r.humidity,
    presion_hpa: Math.round(r.baromrelin*33.8639*100)/100,
    radiacion_wm2: r.solarradiation ?? 0,
    lluvia_mm_hr: Math.round((r.hourlyrainin||0)*25.4*100)/100,
  };
}

function App(){
  const [historial, setHistorial] = useState(REAL_SEED);
  const [meta, setMeta] = useState({ultima_revision:null});
  const [online, setOnline] = useState(null);
  const [tab, setTab] = useState('hoy');
  const [expandedCard, setExpandedCard] = useState(null);
  const [now, setNow] = useState(new Date());
  const [refreshing, setRefreshing] = useState(false);

  async function cargarDatos(){
    setRefreshing(true);
    const url = `https://api.ambientweather.net/v1/devices/${AMBIENT_MAC}?apiKey=${AMBIENT_API_KEY}&applicationKey=${AMBIENT_APP_KEY}&limit=50`;
    try{
      const resp = await fetch(url);
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const arr = await resp.json();
      if(Array.isArray(arr) && arr.length){
        const nuevo = arr.map(convertirRegistroApi).sort((a,b)=> a.fecha < b.fecha ? -1 : 1);
        setHistorial(nuevo);
        setMeta({ultima_revision: new Date().toISOString()});
      }
      setOnline(true);
    }catch(err){
      // Típicamente CORS (si AmbientWeather no permite llamadas desde el navegador)
      // o la estación sin internet. En ambos casos seguimos mostrando la última lectura conocida.
      console.warn('No se pudo consultar la API de AmbientWeather; se muestran los últimos datos conocidos.', err);
      setOnline(false);
    }finally{
      setRefreshing(false);
    }
  }

  useEffect(()=>{
    cargarDatos();
    const iData = setInterval(cargarDatos, INTERVALO_MS);
    const iClock = setInterval(()=>setNow(new Date()), 30*1000);
    return ()=>{ clearInterval(iData); clearInterval(iClock); };
  },[]);

  const ultimo = historial[historial.length-1];
  const activa = ultimo ? (now.getTime() - new Date(ultimo.fecha).getTime()) < 2*3600*1000 : false;

  return e(Fragment, null,
    e(Header,{tab, setTab, online: online===null? activa : (online && activa), ultimoFecha: ultimo && ultimo.fecha, meta, now, onRefresh:cargarDatos, refreshing}),
    e('main',{className:'shell'},
      tab==='hoy'
        ? e(HoyView,{historial, meta, expandedCard, onToggleCard:(id)=>setExpandedCard(prev=>prev===id?null:id)})
        : e(ModeloView,null)
    ),
    e(Footer,null)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
